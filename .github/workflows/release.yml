name: Release

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "assets/**"
      - "android/**"
      - "ios/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    # Skip runs triggered by this workflow's own version-bump commit, to avoid re-releasing in a loop.
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Computes the next vX.Y.Z from Conventional Commits since the last tag, without
      # creating or pushing it - the tag is only created once the release actually succeeds.
      - name: Compute next version
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true

      - name: Generate release notes
        id: release_notes
        run: |
          PREV_TAG="${{ steps.tag_version.outputs.previous_tag }}"
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi
          git log $RANGE --no-merges --pretty=format:%s \
            | sed -E 's/^(feat|fix|chore|docs|refactor)(\([^)]*\))?:[[:space:]]*//I' \
            | sed 's/^/- /' > release_notes.txt
          cat release_notes.txt

          # Play Store wants per-locale "what's new" text (500 char cap) rather
          # than a free-form file, so mirror the same notes into that layout.
          mkdir -p distribution/whatsnew
          cut -c1-500 release_notes.txt > distribution/whatsnew/whatsnew-en-US

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - run: flutter pub get

      - name: Build release binaries
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.tag_version.outputs.new_version }} \
            --build-number=${{ github.run_number }}
          flutter build apk --release \
            --build-name=${{ steps.tag_version.outputs.new_version }} \
            --build-number=${{ github.run_number }}

      - name: Upload to Play Store internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.vignesh.huddle
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          whatsNewDirectory: distribution/whatsnew

      # Only runs if build + upload above succeeded - keeps pubspec.yaml's version in sync
      # with what was actually shipped, and gives the release tag a commit to point at.
      - name: Bump pubspec.yaml version
        id: version_bump
        run: |
          NEW_VERSION="${{ steps.tag_version.outputs.new_version }}+${{ github.run_number }}"
          sed -i -E "s/^version: .+/version: $NEW_VERSION/" pubspec.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to v${{ steps.tag_version.outputs.new_version }} [skip release]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Last step: creates the tag (pointing at the version-bump commit) and the release
      # together. Nothing above this line ever left a tag/release behind on failure.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          target_commitish: ${{ steps.version_bump.outputs.sha }}
          body_path: release_notes.txt
          files: build/app/outputs/flutter-apk/app-release.apk
